services:
  - title: Site sprint
    description: A clear, sharp site that tells customers, investors, and hires what you do in seconds. Live in days, not months.
  - title: Brand refresh
    description: A light-touch identity, type and color system so your startup looks as serious as the round you just raised.
  - title: Motion & interaction
    description: Motion that serves the story, so your product clicks faster and your site feels alive.
steps:
  - tag: 30 min
    title: Discovery call
    description: A 30-minute call about your startup, who you sell to, and what the site needs to say. No pitch, no pressure.
  - tag: Within days
    title: Proposal
    description: You get a clear scope and a quote before anything starts. If you don't love the design, you don't pay.
  - tag: In the open
    title: Design & build
    description: Regular check-ins and live previews, so there are no surprises at the end.
  - tag: And after
    title: Launch & care
    description: I ship it, test it on real devices and stay around for tweaks after launch.
