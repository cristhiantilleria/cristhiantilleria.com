intro: Hey, I'm Cristhian. You raised the round, now your site should look like it. I design and build startup homepages buyers get in seconds.
statement: I help early-stage founders turn a pre-product site into a homepage that explains what they do, fast. One person from first sketch to final deploy, so nothing gets lost between design and code.
