<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Pipe Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        text-align: center;
        padding: 40px;
      }

      .error-code {
        font-size: 120px;
        font-weight: 300;
        color: #000000;
        line-height: 1;
        margin-bottom: 20px;
        letter-spacing: -0.02em;
      }

      .error-message {
        font-size: 18px;
        font-weight: 400;
        color: #000000;
        margin-bottom: 40px;
        letter-spacing: 0.02em;
      }

      .home-link {
        font-size: 14px;
        font-weight: 400;
        color: #000000;
        text-decoration: none;
        border-bottom: 1px solid #000000;
        padding-bottom: 2px;
        transition: opacity 0.3s ease;
        letter-spacing: 0.02em;
      }

      .home-link:hover {
        opacity: 0.6;
      }

      .footer-text {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 12px;
        font-weight: 400;
        color: #000000;
        letter-spacing: 0.02em;
      }

      @media (max-width: 768px) {
        .error-code {
          font-size: 80px;
        }

        .error-message {
          font-size: 16px;
        }

        .footer-text {
          left: 30px;
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">Page not found</div>
        <a href="/" class="home-link">Return to home</a>
      </div>
      <div class="footer-text">
        <div class="studio-email">pipebenitezph@gmail.com</div>
      </div>
    </div>
  </body>
</html>
