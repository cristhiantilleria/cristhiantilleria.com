<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cristhian Tilleria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="photography/images/01.jpg" as="image" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header class="topnav" id="topnav">
    <div class="brand brand-left">Cristhian</div>
    <nav class="links">
      <button type="button" data-mode="photo" class="active">photography</button>
      <button type="button" data-mode="design">design</button>
    </nav>
    <div class="brand brand-right">Tilleria</div>
  </header>

  <section class="hero" id="hero" name="top">
    <div class="side left">Cristhian</div>
    <div class="frame">
      <div class="diptych" id="diptych">
        <div class="panel">
          <div class="slide-stack" id="slide-stack">
            <img class="slide-layer is-active" alt="" decoding="async" fetchpriority="high" />
            <img class="slide-layer" alt="" decoding="async" />
          </div>
        </div>
        <div class="swipe-hint" id="swipe-hint" aria-hidden="true">
          <span class="line"></span>
          <span class="label">swipe</span>
          <span class="line"></span>
        </div>
      </div>
      <div class="hero-caption" id="hero-caption"></div>
    </div>
    <div class="side right">Tilleria</div>
  </section>

  <footer class="footstrip">
    <span class="left"><a href="https://www.instagram.com/pipephoto_/" target="_blank" rel="noopener">Instagram</a></span>
    <span class="center credits">
      <span class="short">Credits</span>
      <span class="full">Created by Cristhian Tilleria</span>
    </span>
    <span class="right"><a href="mailto:cristhiantilleria@gmail.com">Contact</a></span>
  </footer>

  <div class="lightbox" id="lb"><img alt="" /></div>

  <script>
    const photoSlides = [
      { src: 'photography/images/01.jpg' },
      { src: 'photography/images/02.jpg' },
      { src: 'photography/images/03.jpg' },
      { src: 'photography/images/04.jpg' },
      { src: 'photography/images/05.jpg' },
      { src: 'photography/images/06.jpg' },
      { src: 'photography/images/07.jpg' },
      { src: 'photography/images/08.jpg' },
      { src: 'photography/images/09.jpg' },
      { src: 'photography/images/10.jpg' },
      { src: 'photography/images/11.jpg' },
      { src: 'photography/images/12.jpg' },
    ];
    const designSlides = [
      { src: 'design/assets/level-up/image-2.webp',         name: 'Level Up',        type: 'Brand Identity',    href: 'design/projects/level-up/' },
      { src: 'design/assets/sound-sculptors/image-1.webp',  name: 'Sound Sculptors', type: 'Brand Identity',    href: 'design/projects/sound-sculptors/' },
      { src: 'design/assets/arthive/image-1.webp',          name: 'ArtHive',         type: 'Corporate Identity', href: 'design/projects/art-hive/' },
    ];

    const hero = document.getElementById('hero');
    const diptych = document.getElementById('diptych');
    const slideLayers = [...diptych.querySelectorAll('.slide-layer')];
    const captionEl = document.getElementById('hero-caption');
    const lb = document.getElementById('lb');
    const lbImg = lb.querySelector('img');

    let mode = 'photo';
    let idx = 0;
    let zone = 'center';
    let activeLayer = 0;
    let transitioning = false;
    const imageCache = new Map();

    function slides() { return mode === 'design' ? designSlides : photoSlides; }

    function preload(src) {
      if (imageCache.has(src)) return imageCache.get(src);
      const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
      imageCache.set(src, promise);
      return promise;
    }

    function prefetchAdjacent() {
      const list = slides();
      preload(list[(idx + 1) % list.length].src);
      preload(list[(idx - 1 + list.length) % list.length].src);
    }

    function renderCaption(item) {
      if (mode !== 'design') {
        captionEl.innerHTML = '';
        hero.classList.remove('show-caption');
        return;
      }
      captionEl.innerHTML =
        `<span class="tag">Design — ${item.type}</span>` +
        `<a href="${item.href}">${item.name} ↗</a>`;
      hero.classList.add('show-caption');
    }

    async function render(dir = 0) {
      if (transitioning) return;
      const item = slides()[idx];
      const currentEl = slideLayers[activeLayer];
      if (currentEl.src.includes(item.src.split('/').pop())) {
        renderCaption(item);
        prefetchAdjacent();
        return;
      }

      transitioning = true;
      diptych.classList.remove('dir-next', 'dir-prev');
      if (dir > 0) diptych.classList.add('dir-next');
      if (dir < 0) diptych.classList.add('dir-prev');

      const nextLayer = 1 - activeLayer;
      const nextEl = slideLayers[nextLayer];

      try {
        await preload(item.src);
        nextEl.src = item.src;
        if (nextEl.decode) await nextEl.decode();
      } catch (_) {
        nextEl.src = item.src;
      }

      currentEl.classList.add('is-leaving');
      currentEl.classList.remove('is-active');
      nextEl.classList.add('is-entering');
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      nextEl.classList.add('is-active');

      await new Promise((r) => setTimeout(r, 520));

      currentEl.classList.remove('is-leaving');
      nextEl.classList.remove('is-entering');
      activeLayer = nextLayer;
      renderCaption(item);
      prefetchAdjacent();
      transitioning = false;
    }

    function setMode(next) {
      if (mode === next) return;
      mode = next;
      idx = 0;
      transitioning = false;
      imageCache.clear();
      slideLayers.forEach((el) => {
        el.classList.remove('is-active', 'is-entering', 'is-leaving');
      });
      activeLayer = 0;
      slideLayers[0].removeAttribute('src');
      slideLayers[1].removeAttribute('src');
      document.querySelectorAll('.topnav .links button').forEach((b) => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      render();
    }

    document.querySelectorAll('.topnav .links button[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    function go(dir) {
      const list = slides();
      idx = (idx + dir + list.length) % list.length;
      render(dir);
    }

    function openCurrent() {
      const item = slides()[idx];
      if (mode === 'design') {
        window.location.href = item.href;
      } else {
        preload(item.src).then(() => {
          lbImg.src = item.src;
          lb.classList.add('open');
        });
      }
    }

    const swipeHint = document.getElementById('swipe-hint');
    function dismissHint() { if (swipeHint) swipeHint.classList.add('dismissed'); }
    setTimeout(dismissHint, 3500);

    let touchStartX = 0;
    let swipe = false;
    diptych.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      swipe = false;
    }, { passive: true });
    diptych.addEventListener('touchmove', (e) => {
      const dx = e.touches[0].clientX - touchStartX;
      if (Math.abs(dx) > 30) swipe = true;
    }, { passive: true });
    diptych.addEventListener('touchend', (e) => {
      if (swipe) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        go(dx < 0 ? 1 : -1);
        dismissHint();
      }
    });

    function updateZone(e) {
      const r = diptych.getBoundingClientRect();
      const x = e.clientX - r.left;
      if (x < r.width * 0.33) zone = 'left';
      else if (x > r.width * 0.67) zone = 'right';
      else zone = 'center';
      diptych.classList.toggle('zone-left', zone === 'left');
      diptych.classList.toggle('zone-right', zone === 'right');
    }
    diptych.addEventListener('mousemove', updateZone);
    diptych.addEventListener('mouseleave', () => {
      diptych.classList.remove('zone-left', 'zone-right');
      zone = 'center';
    });

    diptych.addEventListener('click', () => {
      if (swipe) { swipe = false; return; }
      if (zone === 'left') go(-1);
      else if (zone === 'right') go(1);
      else openCurrent();
    });

    lb.addEventListener('click', () => lb.classList.remove('open'));
    document.addEventListener('keydown', (e) => {
      if (lb.classList.contains('open') && e.key === 'Escape') lb.classList.remove('open');
    });

    if (location.hash === '#design') setMode('design');

    (async () => {
      const first = slides()[0];
      slideLayers[0].src = first.src;
      if (slideLayers[0].decode) await slideLayers[0].decode();
      renderCaption(first);
      prefetchAdjacent();
      photoSlides.forEach((s) => preload(s.src));
    })();
  </script>
</body>
</html>
