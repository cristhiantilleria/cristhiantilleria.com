# Pages CMS configuration: https://pagescms.org/docs/configuration/
media:
  input: media
  output: /media

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: '{primary}.json'
    view:
      fields: [title, type, order, published]
      primary: title
      sort: [order, title]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: type, label: Type (e.g. Design + build), type: string }
      - { name: year, label: Year, type: string }
      - { name: role, label: Your role, type: string }
      - { name: order, label: Order (1 = first and widest card), type: number }
      - { name: published, label: Show on site, type: boolean, default: true }
      - { name: cover, label: Cover image, type: image }
      - { name: video, label: Cover video (optional short muted MP4 that loops on the home page card), type: file }
      - { name: link, label: Live site URL, type: string }
      - { name: summary, label: Summary (one or two sentences), type: text }
      - { name: approach, label: Approach (short paragraph), type: text }
      - name: gallery
        label: Gallery
        type: image
        options:
          multiple:
            max: 30
      - { name: body, label: Extra case study text (optional), type: rich-text }

  - name: visuals
    label: Visuals
    type: file
    path: content/visuals.json
    format: json
    fields:
      - { name: intro, label: Intro line, type: text }
      - name: items
        label: Pieces
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image }
          - { name: title, label: Title, type: string }
          - { name: kind, label: Kind (e.g. Photography or Experiment), type: string }

  - name: site
    label: Site content
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: url, label: Site address, type: string }
      - { name: description, label: Search description (home page), type: text }
      - { name: email, label: Contact email, type: string }
      - { name: bookingUrl, label: Calendar booking link, type: string }
      - { name: status, label: Availability status, type: string }
      - { name: intro, label: Hero intro line, type: text }
      - { name: statement, label: About statement, type: text }
      - { name: portrait, label: About portrait, type: image }
      - { name: ticker, label: Ticker phrases, type: string, list: true }
      - name: services
        label: Services
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: text }
      - name: steps
        label: Process steps
        type: object
        list: true
        fields:
          - { name: tag, label: Small tag, type: string }
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: text }
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: URL, type: string }
